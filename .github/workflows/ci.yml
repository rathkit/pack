name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The plugin host needs Node 24 or newer; test the oldest and the newest, and a second CPU architecture.
        include:
          - { os: ubuntu-latest, node: 24, browser: true }
          - { os: ubuntu-latest, node: 26, browser: true }
          - { os: ubuntu-24.04-arm, node: 24, browser: false }
    env:
      # The TypeScript compiler the JSX and decorator programs are compared with.
      TS_MODULE: ${{ github.workspace }}/bench/node_modules/ts5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm, this job's Node, and the install of bench (the libraries and compilers the comparisons bundle; nothing from
      # there is built into the bundler) from its lockfile, in one step.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          runtime: node@${{ matrix.node }}
          working-directory: bench
          cache: true
          require-lockfile: true
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: node tools/check-zero-deps.mjs
      # The release's bill of materials is made from the same rules and must list no components.
      - run: node tools/make-sbom.mjs "$RUNNER_TEMP/sbom.cdx.json" && node -e "process.exit(require(process.argv[1]).components.length)" "$RUNNER_TEMP/sbom.cdx.json"
      - run: cargo build --release
      - run: cargo test --release
      - run: node tools/run-fixtures.mjs
      - run: node tools/run-defines.mjs
      - run: node tools/run-loaders.mjs
      - run: node tools/run-plugins.mjs
      - run: node tools/run-assets.mjs
      - run: node tools/run-target.mjs
      - run: node tools/test-npm-wrapper.mjs
      - run: node tools/run-split.mjs
      - run: node tools/run-sourcemaps.mjs
      - run: node tools/run-watch.mjs
      - run: node tools/run-serve.mjs
      - run: node tools/run-jsx.mjs
      - run: node tools/test-federation-runtime.mjs
      - run: node tools/diff-semver.mjs
      # Module federation in a real browser; the x64 runner has Chrome.
      - if: matrix.browser
        run: node tools/run-federation.mjs
        env:
          CHROME: google-chrome
      - run: python3 tools/fuzz-bundle.py --count 300
      - run: node tools/diff-real.mjs "$GITHUB_WORKSPACE/bench"

  # What must never be in the repository: secrets, and the words of the private list (when the list is set as a secret; a fork's pull
  # request has no secrets, so only the secret scan runs there). The whole history is scanned by hand: history-scan.yml.
  hygiene:
    name: secrets and words
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RATHKIT_DENYLIST: ${{ secrets.RATHKIT_DENYLIST }}
      RTE_DENYLIST: ${{ secrets.RTE_DENYLIST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          runtime: node@24
          working-directory: bench
          install: false
      - run: node --test tools/scan-secrets.test.mjs
      - run: node tools/scan-secrets.mjs
      - name: Word check
        if: env.RATHKIT_DENYLIST != '' || env.RTE_DENYLIST != ''
        run: node tools/check-denylist.mjs
        env:
          CI: "true"
      - name: The word check did not run (no list set)
        if: env.RATHKIT_DENYLIST == '' && env.RTE_DENYLIST == ''
        run: echo "::warning::RATHKIT_DENYLIST is not set; the word check was skipped"

  # The musl build (Alpine): the program has no C dependencies, so it runs there as it is built; this checks it does.
  musl:
    name: alpine (musl) node 24
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: node:24-alpine
    env:
      TS_MODULE: ${{ github.workspace }}/bench/node_modules/ts5
    steps:
      - run: apk add --no-cache git rust cargo python3 bash
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm and the install of bench; the container's own Node is the one that runs the tests.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          working-directory: bench
          cache: true
          require-lockfile: true
      - run: cargo build --release
      - run: ./target/release/rkp --version
      - run: cargo test --release
      - run: node tools/run-fixtures.mjs
      - run: node tools/run-loaders.mjs
      - run: node tools/run-plugins.mjs
      - run: node tools/run-split.mjs
      - run: node tools/run-watch.mjs
      - run: node tools/run-serve.mjs
      - run: node tools/test-npm-wrapper.mjs
