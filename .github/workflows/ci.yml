name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand on a branch (`gh workflow run ci -r main`), for example to count clean runs in a row.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A run started by hand has a group of its own, so it is not cancelled by a push and does not cancel another.
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # glibc: x64 and arm64, the oldest and the newest Node that runs the plugin host. The musl job below runs the same checks.
    # Runner images are pinned to a version, never `-latest`, so what runs does not change under us. The job names are what the main
    # ruleset requires: renaming or adding a leg means changing the ruleset too.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "ubuntu-24.04 node 24", os: ubuntu-24.04, node: 24, browser: true, other-browsers: true, baseline: true }
          - { name: "ubuntu-24.04 node 26", os: ubuntu-24.04, node: 26, browser: true, other-browsers: true }
          - { name: "ubuntu-26.04 node 24", os: ubuntu-26.04, node: 24, browser: true }
          - { name: "ubuntu-26.04 node 26", os: ubuntu-26.04, node: 26, browser: true }
          - { name: "ubuntu-24.04-arm node 24", os: ubuntu-24.04-arm, node: 24 }
          - { name: "ubuntu-24.04-arm node 26", os: ubuntu-24.04-arm, node: 26 }
          - { name: "ubuntu-26.04-arm node 24", os: ubuntu-26.04-arm, node: 24 }
          - { name: "ubuntu-26.04-arm node 26", os: ubuntu-26.04-arm, node: 26 }
    env:
      # The TypeScript compiler the JSX and decorator programs are compared with.
      TS_MODULE: ${{ github.workspace }}/test-deps/node_modules/ts5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm, this job's Node, and the install of test-deps (the libraries and compilers the differential and interop tests load;
      # nothing from there is built into the bundler) from its lockfile, in one step.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          runtime: node@${{ matrix.node }}
          working-directory: test-deps
          cache: true
          require-lockfile: true
      # The toolchain comes from static.rust-lang.org, which now and then does not answer (a macOS leg stopped on it), so a try is repeated.
      - run: |
          for attempt in 1 2 3; do
            rustup toolchain install stable --profile minimal && break
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          rustup default stable
      - run: node --version
      - run: node tools/check-zero-deps.mjs
      # The release's bill of materials is made from the same rules and must list no components.
      - run: node tools/make-sbom.mjs "$RUNNER_TEMP/sbom.cdx.json" && node -e "process.exit(require(process.argv[1]).components.length)" "$RUNNER_TEMP/sbom.cdx.json"
      # Which address `localhost` resolves to first differs between machines; the dev server answers on both loopback addresses.
      - name: How localhost resolves
        run: getent hosts localhost || true; cat /etc/hosts || true
      - run: cargo build --release
      - run: ./target/release/rkp --version
      # Output size and peak memory against tests/baseline.json (roadmap 3.6): a build that got bigger or used more memory fails here.
      # One leg runs it (GNU time and a fixed CPU count make the memory figures comparable); the leg's name is already required, so
      # the gate needs no ruleset change. Update the baseline with `node tools/check-baseline.mjs --update` when the change is wanted.
      - if: matrix.baseline
        run: node tools/check-baseline.mjs
      # A step that runs out of time ends with its log kept (a job that runs out of time loses it), and cargo names a test that runs over 60 seconds.
      - run: cargo test --release
        timeout-minutes: 20
      - run: node tools/run-fixtures.mjs
      - run: node tools/run-defines.mjs
      - run: node tools/run-loaders.mjs
      - run: node tools/run-plugins.mjs
      - run: node tools/run-assets.mjs
      - run: node tools/run-css.mjs
      - run: node tools/run-target.mjs
      - run: node tools/test-npm-wrapper.mjs
      - run: node tools/check-promises.mjs
      - run: node tools/run-split.mjs
      - run: node tools/run-sourcemaps.mjs
      - run: node tools/run-watch.mjs
      - run: node tools/run-serve.mjs
      - run: node tools/run-jsx.mjs
      - run: node tools/test-federation-runtime.mjs
      - run: node tools/diff-semver.mjs
      # Module federation in a real browser; the x64 runner has Chrome.
      - if: matrix.browser
        run: node tools/run-federation.mjs
        env:
          CHROME: google-chrome
      # The same scenarios in Firefox and WebKit, the builds Playwright ships (tools/lib/browsers.mjs drives them with no dependency of
      # ours; the version is pinned so the builds, and the protocol WebKit speaks, do not change under us).
      # The install normally takes about a minute. One run spent 24 minutes in it (a slow package mirror) and then ran out of the job's
      # time, so each try is cut off at seven minutes and there are two. A stalled download is the cause (one package waited four and a
      # half minutes before apt gave up on it), so apt is told to give up on a silent connection after 15 seconds and to retry. That was
      # not enough (apt hung with no output for seven minutes, twice in a row), so the downloaded packages are kept in the Actions cache:
      # a run that finds them does not ask the mirror for them, and one that does not falls back to the mirror as before.
      - if: matrix.other-browsers
        id: debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-playwright-1.64.1-v1
      # The runner's first apt mirror (azure.archive.ubuntu.com) often fails to resolve and apt then gives up; see tools/ci-apt-mirror.sh.
      - if: matrix.other-browsers
        name: Make the apt mirror name resolve
        run: bash tools/ci-apt-mirror.sh
      - if: matrix.other-browsers
        name: Install Firefox and WebKit
        timeout-minutes: 16
        run: |
          if ls ~/apt-debs/*.deb >/dev/null 2>&1; then sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/; fi
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/99-rathkit-fetch >/dev/null
          for attempt in 1 2; do
            timeout --kill-after=20 420 pnpm dlx playwright@1.64.1 install --with-deps firefox webkit && exit 0
            echo "attempt $attempt of the browser install did not finish"
            # the killed install leaves its apt-get running, which holds the dpkg lock
            sudo killall apt-get dpkg 2>/dev/null || true
            sudo dpkg --configure -a
          done
          exit 1
      - if: matrix.other-browsers && steps.debs.outputs.cache-hit != 'true'
        name: Keep the downloaded packages
        run: |
          mkdir -p ~/apt-debs
          sudo cp /var/cache/apt/archives/*.deb ~/apt-debs/
          sudo chown -R "$USER" ~/apt-debs
      - if: matrix.other-browsers && steps.debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-playwright-1.64.1-v1
      - if: matrix.other-browsers
        run: |
          for browser in firefox webkit; do
            BROWSER=$browser node tools/test-browser-check.mjs
            BROWSER=$browser node tools/run-federation.mjs
            BROWSER=$browser node tools/run-hmr.mjs
          done
      - run: python3 tools/fuzz-bundle.py --count 300
      - run: node tools/diff-real.mjs "$GITHUB_WORKSPACE/test-deps"

  # macOS and Windows: the same checks as the glibc job, not yet required by the ruleset (it is made to require them after several green runs).
  # Steps that need Linux (the localhost note, Chrome) are left out; a step that fails here shows what still assumes Unix.
  check-os:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macos-15 node 24", os: macos-15, node: 24 }
          - { name: "macos-15 node 26", os: macos-15, node: 26 }
          - { name: "macos-15-intel node 24", os: macos-15-intel, node: 24 }
          - { name: "macos-15-intel node 26", os: macos-15-intel, node: 26 }
          - { name: "macos-26 node 24", os: macos-26, node: 24 }
          - { name: "macos-26 node 26", os: macos-26, node: 26 }
          - { name: "macos-26-intel node 24", os: macos-26-intel, node: 24 }
          - { name: "macos-26-intel node 26", os: macos-26-intel, node: 26 }
          - { name: "windows-2025 node 24", os: windows-2025, node: 24 }
          - { name: "windows-2025 node 26", os: windows-2025, node: 26 }
          - { name: "windows-2022 node 24", os: windows-2022, node: 24 }
          - { name: "windows-2022 node 26", os: windows-2022, node: 26 }
          - { name: "windows-11-arm node 24", os: windows-11-arm, node: 24 }
          - { name: "windows-11-arm node 26", os: windows-11-arm, node: 26 }
    defaults:
      run:
        shell: bash
    env:
      TS_MODULE: ${{ github.workspace }}/test-deps/node_modules/ts5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          runtime: node@${{ matrix.node }}
          working-directory: test-deps
          cache: true
          require-lockfile: true
      # The toolchain comes from static.rust-lang.org, which now and then does not answer (a macOS leg stopped on it), so a try is repeated.
      - run: |
          for attempt in 1 2 3; do
            rustup toolchain install stable --profile minimal && break
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          rustup default stable
      - run: node --version
      - run: node tools/check-zero-deps.mjs
      - run: node tools/make-sbom.mjs "$RUNNER_TEMP/sbom.cdx.json" && node -e "process.exit(require(process.argv[1]).components.length)" "$RUNNER_TEMP/sbom.cdx.json"
      - run: cargo build --release
      - run: ./target/release/rkp --version
      # A step that runs out of time ends with its log kept (a job that runs out of time loses it), and cargo names a test that runs over 60 seconds.
      - run: cargo test --release
        timeout-minutes: 20
      - run: node tools/run-fixtures.mjs
      - run: node tools/run-defines.mjs
      - run: node tools/run-loaders.mjs
      - run: node tools/run-plugins.mjs
      - run: node tools/run-assets.mjs
      - run: node tools/run-css.mjs
      - run: node tools/run-target.mjs
      - run: node tools/test-npm-wrapper.mjs
      - run: node tools/check-promises.mjs
      - run: node tools/run-split.mjs
      - run: node tools/run-sourcemaps.mjs
      - run: node tools/run-watch.mjs
      - run: node tools/run-serve.mjs
      - run: node tools/run-jsx.mjs
      - run: node tools/test-federation-runtime.mjs
      - run: node tools/diff-semver.mjs
      - run: node tools/diff-real.mjs "$GITHUB_WORKSPACE/test-deps"

  # docs/ROADMAP.md and the issues agree: a ticked item has a closed issue and the reverse. In a pull request the issue is still open (the
  # merge closes it), so there a ticked item with an open issue is a warning. Not a required check.
  roadmap:
    name: roadmap and issues agree
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node tools/test-check-roadmap.mjs
      - run: node tools/check-roadmap.mjs ${{ github.event_name == 'pull_request' && '--warn-open' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # What must never be in the repository: secrets, and the words of the private list (when the list is set as a secret; a fork's pull
  # request has no secrets, so only the secret scan runs there). The whole history is scanned by hand: history-scan.yml.
  hygiene:
    name: secrets and words
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RATHKIT_DENYLIST: ${{ secrets.RATHKIT_DENYLIST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          runtime: node@24
          working-directory: test-deps
          install: false
      - run: node --test tools/scan-secrets.test.mjs tools/approve-release.test.mjs tools/check-baseline.test.mjs
      - run: node tools/scan-secrets.mjs
      - name: Word check
        if: env.RATHKIT_DENYLIST != ''
        run: node tools/check-denylist.mjs
        env:
          CI: "true"
      - name: The word check did not run (no list set)
        if: env.RATHKIT_DENYLIST == ''
        run: echo "::warning::RATHKIT_DENYLIST is not set; the word check was skipped"

  # The musl build (Alpine): the program has no C dependencies, so it is built and run there as it is; this checks it. The same
  # checks as the job above, run by a script in a container, because GitHub cannot run JavaScript actions in an Alpine container
  # on arm64 (tools/ci-musl.sh). The container's own Node is the one that runs the tests. No browser on Alpine.
  musl:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "alpine (musl) node 24", os: ubuntu-24.04, node: 24 }
          - { name: "alpine (musl) node 26", os: ubuntu-24.04, node: 26 }
          - { name: "alpine (musl, arm64) node 24", os: ubuntu-24.04-arm, node: 24 }
          - { name: "alpine (musl, arm64) node 26", os: ubuntu-24.04-arm, node: 26 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/ci-musl.sh ${{ matrix.node }}
