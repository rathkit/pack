# Publishes a GitHub Release when a version tag is pushed: one tarball per platform, SHA256SUMS,
# an SBOM that lists zero runtime components, and a Sigstore (keyless) signature of each file.
# Releases are pre-releases while the version has a suffix such as -alpha.0.
# How a consumer checks all of this: docs/verifying.md.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64-gnu }
          - { os: ubuntu-24.04-arm, target: linux-arm64-gnu }
          # Static builds for Alpine and other musl systems (the program has no C dependencies).
          - { os: ubuntu-latest, target: linux-x64-musl, triple: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: linux-arm64-musl, triple: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
          - { os: windows-latest, target: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: The tag is the version in Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME is not v$version"; exit 1; }
      - name: Build and test
        shell: bash
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          flags=""
          if [ -n "$TRIPLE" ]; then rustup target add "$TRIPLE"; flags="--target $TRIPLE"; fi
          cargo build --release --locked $flags
          cargo test --release --locked $flags
      - name: Run the musl build in Alpine
        if: matrix.triple
        run: docker run --rm -v "$PWD/target/${{ matrix.triple }}/release:/p:ro" alpine:3.22 /p/rkp --version
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          out=target/release
          if [ -n "$TRIPLE" ]; then out="target/$TRIPLE/release"; fi
          name="rathkit-pack-${GITHUB_REF_NAME#v}-$TARGET"
          mkdir "$name"
          cp LICENSE README.md "$name/"
          if [ "$RUNNER_OS" = Windows ]; then cp "$out/rkp.exe" "$out/rathkit-pack.exe" "$name/"; else cp "$out/rkp" "$out/rathkit-pack" "$name/"; fi
          "$name/rkp" --version
          "$name/rathkit-pack" --version
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.target }}
          path: rathkit-pack-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # the keyless signature is made with this run's identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: SBOM, checksums, signatures
        working-directory: dist
        run: |
          SOURCE_DATE_EPOCH=$(git -C .. log -1 --format=%ct) node ../tools/make-sbom.mjs rathkit-pack-${GITHUB_REF_NAME#v}.sbom.cdx.json
          sha256sum *.tar.gz *.cdx.json > SHA256SUMS
          for f in *.tar.gz *.cdx.json SHA256SUMS; do cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"; done
          ls -l
      - name: Release notes from CHANGELOG.md
        run: node tools/release-notes.mjs "${GITHUB_REF_NAME#v}" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease

  npm:
    # The same binaries as npm packages: a launcher and one package per platform, published with provenance.
    # Trusted publishing (OIDC) needs each package to name this repository and workflow in its npm settings.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and the provenance statement
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true
      - name: npm supports trusted publishing
        run: node -e "const [a,b]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&b<5)) { console.error('npm '+process.argv[1]+' is too old for trusted publishing'); process.exit(1); }" "$(npm --version)"
      - run: node tools/make-npm-packages.mjs --out npm-out --from dist
      - name: Publish (a version with a suffix goes to the next tag, never latest)
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          for dir in npm-out/pack-*; do npm publish "$dir" --provenance --access public --tag "$tag"; done
          npm publish npm-out/pack --provenance --access public --tag "$tag"
