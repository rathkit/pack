# Builds, checks and signs a release, and publishes it when a version tag is pushed: one tarball per platform,
# SHA256SUMS, an SBOM that lists zero runtime components, and a Sigstore (keyless) signature of each file.
# Releases are pre-releases while the version has a suffix such as -alpha.0.
# By hand it is a dry run: everything is built, tested, signed and kept as a workflow artifact, and nothing is released or published.
# The npm packages are published only when the repository variable NPM_PUBLISH is "true", which the owner sets after the
# trusted publishers are configured on npm. No npm token is stored anywhere: publishing uses trusted publishing (OIDC).
# How a consumer checks all of this: docs/verifying.md.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build as a dry run, for example v0.1.0-alpha.0 (nothing is released or published)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The tag being released: the pushed one, or the one asked for in a dry run.
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      # One platform failing must not hide what the others do.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64-gnu }
          - { os: ubuntu-24.04-arm, target: linux-arm64-gnu }
          # Static builds for Alpine and other musl systems (the program has no C dependencies).
          - { os: ubuntu-latest, target: linux-x64-musl, triple: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: linux-arm64-musl, triple: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
          - { os: windows-latest, target: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tests start the plugin host, which needs Node 24 or later; the runners' own Node is older.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          runtime: node@24
          working-directory: bench
          install: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: The tag is the version in Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$TAG" || { echo "tag $TAG is not v$version"; exit 1; }
      - name: Build and test
        shell: bash
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          flags=""
          if [ -n "$TRIPLE" ]; then rustup target add "$TRIPLE"; flags="--target $TRIPLE"; fi
          cargo build --release --locked $flags
          cargo test --release --locked $flags
      - name: Run the musl build in Alpine
        if: matrix.triple
        run: docker run --rm -v "$PWD/target/${{ matrix.triple }}/release:/p:ro" alpine:3.22 /p/rkp --version
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          out=target/release
          if [ -n "$TRIPLE" ]; then out="target/$TRIPLE/release"; fi
          name="rathkit-pack-${TAG#v}-$TARGET"
          mkdir "$name"
          cp LICENSE README.md "$name/"
          if [ "$RUNNER_OS" = Windows ]; then cp "$out/rkp.exe" "$name/"; else cp "$out/rkp" "$name/"; fi
          "$name/rkp" --version
          # The binary of this platform builds a program and the program runs (on Windows too, where the unit tests that use fake Unix paths are skipped).
          mkdir smoke && cd smoke
          printf 'import { x } from "./dep.js";\nconsole.log("smoke", x);\n' > main.js
          printf 'export const x = 40 + 2;\n' > dep.js
          "../$name/rkp" bundle main.js --outfile out.mjs
          test "$(node out.mjs)" = "smoke 42"
          "../$name/rkp" bundle main.js --outfile min.mjs --minify --sourcemap
          test "$(node min.mjs)" = "smoke 42"
          cd ..
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.target }}
          path: rathkit-pack-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # the keyless signature is made with this run's identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          runtime: node@24
          working-directory: bench
          install: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true
      # cosign comes straight from its release, at a pinned version and checksum (the organization allows only GitHub's own and verified actions).
      - name: Install cosign
        env:
          GH_TOKEN: ${{ github.token }}
          COSIGN_VERSION: v3.1.4
          COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
        run: |
          gh release download "$COSIGN_VERSION" --repo sigstore/cosign --pattern cosign-linux-amd64 --dir "$RUNNER_TEMP"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/cosign-linux-amd64" | sha256sum --check --strict
          install -m 0755 "$RUNNER_TEMP/cosign-linux-amd64" "$RUNNER_TEMP/cosign"
      - name: SBOM, checksums, signatures
        working-directory: dist
        run: |
          SOURCE_DATE_EPOCH=$(git -C .. log -1 --format=%ct) node ../tools/make-sbom.mjs rathkit-pack-${TAG#v}.sbom.cdx.json
          sha256sum *.tar.gz *.cdx.json > SHA256SUMS
          for f in *.tar.gz *.cdx.json SHA256SUMS; do "$RUNNER_TEMP/cosign" sign-blob --yes --bundle "$f.sigstore.json" "$f"; done
          ls -l
      - name: Release notes from CHANGELOG.md
        run: node tools/release-notes.mjs "${TAG#v}" > notes.md
      - name: A dry run keeps the files as an artifact
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/*
            notes.md
          if-no-files-found: error
      - name: Create the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md $prerelease

  npm-pack:
    # Every run: the npm packages are made from the tarballs and packed, so a mistake shows before a tag does.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          runtime: node@24
          working-directory: bench
          install: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true
      - run: node tools/make-npm-packages.mjs --out npm-out --from dist
      - name: Pack each package, and check the launcher lists every platform
        run: |
          mkdir npm-packed
          for dir in npm-out/*/; do (cd "$dir" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/npm-packed" >/dev/null); done
          ls -l npm-packed
          test "$(ls npm-packed | wc -l)" = 8
          for f in npm-packed/*.tgz; do tar -tzf "$f" | grep -qx 'package/NOTICE' || { echo "$f has no NOTICE"; exit 1; }; done
          node -e "const d=require('./npm-out/pack/package.json').optionalDependencies; if (Object.keys(d).length!==7) { console.error(d); process.exit(1) }"

  npm:
    # The same binaries as npm packages: a launcher and one package per platform, staged with provenance. Nothing goes live here:
    # each version waits in npm until the owner approves it with two-factor authentication (docs/RELEASING.md).
    # Trusted publishing (OIDC) needs each package to name this repository, this workflow and the npm environment in its npm settings.
    needs: build
    if: github.event_name == 'push' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing and the provenance statement
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # npm itself does the staging, so this job uses the Node that comes with a new enough npm.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true
      - run: node tools/make-npm-packages.mjs --out npm-out --from dist
      - name: Stage with provenance (a version with a suffix goes to the next tag, never latest)
        run: |
          npm --version
          tag=latest
          case "$TAG" in *-*) tag=next ;; esac
          mkdir npm-packed
          for dir in npm-out/pack-*/ npm-out/pack/; do (cd "$dir" && npm pack --pack-destination "$GITHUB_WORKSPACE/npm-packed" >/dev/null); done
          test "$(ls npm-packed | wc -l)" = 8
          # The platform packages first and the launcher last. The ./ matters: npm reads a bare dir/name.tgz as a GitHub repository.
          launcher="./npm-packed/rathkit-pack-${TAG#v}.tgz"
          test -f "$launcher"
          for file in ./npm-packed/*.tgz; do
            [ "$file" = "$launcher" ] && continue
            npm stage publish "$file" --access public --tag "$tag" --provenance
          done
          npm stage publish "$launcher" --access public --tag "$tag" --provenance
