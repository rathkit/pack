[package]
name = "rathkit-pack"
version = "0.1.0-alpha.1"
edition = "2024"
description = "A fast, zero-dependency JavaScript and TypeScript bundler"
license = "Apache-2.0"
repository = "https://github.com/rathkit/pack"
homepage = "https://github.com/rathkit/pack#readme"
readme = "README.md"
keywords = ["bundler", "javascript", "typescript", "zero-dependency", "alpha"]
categories = ["development-tools", "web-programming"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md"]

[lib]
name = "rathkit_pack"
path = "src/lib.rs"

[[bin]]
name = "rkp"
path = "src/main.rs"

[[bin]]
name = "prof"
path = "src/bin/prof.rs"
# Linux x86-64 only, so it is opt-in: see the header of src/bin/prof.rs.
required-features = ["profiling"]

[features]
profiling = []

# Zero dependencies is a hard rule. `pnpm`-style enforcement lives in tools/check-zero-deps.mjs.
[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Used only for profiling: optimized, with symbols. Build with
# RUSTFLAGS="-C force-frame-pointers=yes" so the sampling profiler can walk stacks.
[profile.profiling]
inherits = "release"
debug = true
